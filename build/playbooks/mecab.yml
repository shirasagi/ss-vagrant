- name: Change /usr/local/src permission
  file:
    path: /usr/local/src
    mode: '0777'
  become: yes

- name: Unarchive MeCab Ruby
  unarchive:
    src: /home/vagrant/shirasagi/vendor/mecab/mecab-ruby-0.996.tar.gz
    dest: /usr/local/src/
    remote_src: true

- name: Install Mecab Ruby
  shell: |
    export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"
    cd /usr/local/src/mecab-ruby-0.996
    ruby extconf.rb
    make
    sudo make install
  args:
    creates: /home/vagrant/.asdf/installs/ruby/{{ruby_version}}/lib/ruby/site_ruby/{{ruby_series}}/x86_64-linux/MeCab.so
