- name: setup mongodb repo (yum)
  copy:
    src: fixtures/mongodb-org.repo
    dest: /etc/yum.repos.d/mongodb-org-{{ mongo_version }}.repo
    owner: root
  become: yes
  when: ansible_distribution == "AlmaLinux"
- name: install mongodb (yum)
  yum:
    name: mongodb-org
    state: present
  become: yes
  when: ansible_distribution == "AlmaLinux"
- name: setup mongodb repo (apt)
  copy:
    src: fixtures/mongodb-org-{{ mongo_version}}-{{ ansible_distribution | lower }}-{{ ansible_distribution_version | lower }}.list
    dest: /etc/apt/sources.list.d/mongodb-org-{{ mongo_version }}.list
    owner: root
  become: yes
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"
- name: install key (apt)
  copy:
    src: fixtures/mongodb-org-server-{{ mongo_version }}.asc
    dest: /usr/share/keyrings/mongodb-server-{{ mongo_version }}.asc
    owner: root
  become: yes
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"
- name: install mongodb (apt)
  apt:
    name: mongodb-org
    update_cache: yes
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"
- name: start mongodb
  service:
    name: mongod
    state: started
    enabled: yes
  become: yes
