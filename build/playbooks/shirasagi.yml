- shell: |
    site_id=$(mongosh --quiet --eval 'db.ss_sites.find({ host: "www" }, { _id: 1 })' 127.0.0.1/ss | jq -r ._id)
    mongosh --quiet --eval "db.cms_pages.find({ site_id: $site_id, filename: 'index.html' }, { filename: 1 })" 127.0.0.1/ss | jq ._id
  register: site_www_page_existance
  ignore_errors: yes
  args:
    chdir: /home/vagrant/shirasagi
- name: 'install seeds to "自治体サンプル"'
  shell: |
    export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"
    bundle exec rake db:seed name=demo site=www
  when: site_www_page_existance.stdout == ""
  args:
    chdir: /home/vagrant/shirasagi
  async: 3600
  poll: 10
