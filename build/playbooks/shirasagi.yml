- name: generate nodes and pages
  shell: |
    export PATH="${ASDF_DATA_DIR:-$HOME/.asdf}/shims:$PATH"
    bundle exec rake cms:generate_nodes
    bundle exec rake cms:generate_pages
  args:
    chdir: /home/vagrant/shirasagi
  async: 3600
  poll: 10
- name: overwrite the file "puma"
  copy:
    src: fixtures/puma.service
    dest: /etc/systemd/system/puma.service
  become: true
- name: reload systemd manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
- name: start Shirasagi-job service
  systemd_service:
    name: puma.service
    state: started
    enabled: true
  become: true
